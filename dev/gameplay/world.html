<!doctype html>
<!-- Dev harness for echo/game (NOT part of the Qollab upload). Serve the worktree root AND the dev
     engine (real Qiskit in local CPython) from one process, on your own port:
     python3 dev/gameplay/dev_engine.py 8641   →   http://127.0.0.1:8641/dev/gameplay/world.html
     Terminals are the dev terminal (dev only); story-ui owns the real terminals. This page also
     stands in for platform's main.js (BOOT_COMPLETE) and story-ui's menus and cinematic timer. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>ECHO — gameplay harness</title>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js" } }
</script>
<style>
  html, body { margin: 0; height: 100%; background: #070b12; color: #eaf3f6; font: 14px/1.4 ui-monospace, Menlo, monospace; overflow: hidden; }
  #game-root { position: fixed; inset: 0; }
  .overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(7, 11, 18, 0.78); }
  .panel { background: #132035; border: 1px solid #56e4f2; padding: 24px 28px; min-width: 320px; max-width: min(1100px, 90vw); box-sizing: border-box; }
  h1 { font-size: 28px; letter-spacing: 0.2em; margin: 0 0 16px; color: #56e4f2; }
  button { font: inherit; background: #070b12; color: #eaf3f6; border: 1px solid #56e4f2; padding: 8px 14px; margin: 4px 4px 0 0; cursor: pointer; }
  button:focus-visible { outline: 3px solid #f3ae62; outline-offset: 2px; }
  #prompt { position: fixed; left: 50%; bottom: 18%; transform: translateX(-50%); background: rgba(19, 32, 53, 0.9); border: 1px solid #56e4f2; padding: 8px 14px; }
  #prompt b { color: #070b12; background: #56e4f2; padding: 0 6px; margin-right: 8px; }
  #readout { position: fixed; left: 10px; top: 10px; background: rgba(7, 11, 18, 0.7); padding: 6px 10px; white-space: pre; }
  #hint { position: fixed; right: 10px; top: 10px; background: rgba(7, 11, 18, 0.7); padding: 6px 10px; color: #9fb0c4; }
  [hidden] { display: none !important; }
  .dt-state { color: #56e4f2; margin-bottom: 6px; } .dt-note { color: #f3ae62; min-height: 1.4em; margin: 6px 0; }
  .dt-result { max-height: 160px; overflow: auto; font-size: 11px; background: #070b12; padding: 6px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .dt-bits { color: #f3ae62; font-size: 16px; margin: 6px 0; }
  button:disabled { opacity: 0.4; }
</style>
</head>
<body>
<div id="game-root"></div>
<div id="readout"></div>
<div id="hint">WASD move · Shift sprint · mouse/drag orbit · E interact · Esc pause</div>
<div id="prompt" hidden><b>E</b><span id="prompt-label"></span></div>

<div id="title" class="overlay"><div class="panel"><h1>ECHO: ONE OF ONE</h1><p>gameplay harness</p><button id="play">PLAY</button></div></div>
<div id="pause" class="overlay" hidden><div class="panel"><h1>PAUSED</h1><button id="resume">Resume</button><button id="restart">Restart</button></div></div>
<div id="terminal" class="overlay" hidden><div class="panel"><h1 id="term-title"></h1><p>DEV terminal (dev engine: Qiskit in local CPython) — not the product UI.</p><div id="term-host"></div><button id="term-close">Close</button></div></div>
<div id="ending" class="overlay" hidden><div class="panel"><h1>ENDING</h1><p>The city is lit.</p><button id="end-credits">Credits</button><button id="end-restart">Restart</button></div></div>
<div id="credits" class="overlay" hidden><div class="panel"><h1>CREDITS</h1><button id="credits-restart">Restart</button></div></div>

<script type="module">
import { startGame, BUILD } from '../../echo/game/app.js';
import { BUS_EVENTS } from '../../echo/contracts.js';
import { createDevEngine } from './devEngine.js';
import { mountDevTerminal } from './devTerminal.js';

const $ = (id) => document.getElementById(id);
let fps = { fps: 0, ms: 0, calls: 0 };

const ui = {
  mount({ bus, quest, quantum, game }) {
    window.__echo = game;
    let termId = null;
    // In the world, the terminal stands in for story-ui's acknowledgements only: doors are walked through.
    mountDevTerminal($('term-host'), { machine: quest, bus, quantum, sources: ['terminal_acknowledgement'] });
    const show = () => {
      $('title').hidden = quest.state !== 'TITLE';
      $('ending').hidden = quest.state !== 'ENDING';
      $('credits').hidden = quest.state !== 'CREDITS';
      $('pause').hidden = !game.paused;
      $('terminal').hidden = !termId;
      $('term-title').textContent = termId ?? '';
    };
    const closeTerminal = () => { const id = termId; termId = null; show(); if (id) bus.emit(BUS_EVENTS.CLOSE_TERMINAL, { id }); };
    bus.on('ui:prompt', (p) => { $('prompt').hidden = !p; $('prompt-label').textContent = p ? p.label : ''; });
    bus.on(BUS_EVENTS.OPEN_TERMINAL, ({ id }) => { termId = id; show(); });
    bus.on('ui:pause', show);
    bus.on(BUS_EVENTS.QUEST_STATE_CHANGED, ({ to }) => {
      // Stands in for narrative: close the terminal on commit, end the transfer animation after 5 s.
      if (to === 'TELEPORT_COMMITTED') { closeTerminal(); setTimeout(() => quest.send('ANIMATION_END', 'cinematic'), 5000); }
      if (to === 'TITLE') termId = null;
      show();
    });
    bus.on('perf:fps', (f) => { fps = f; });
    $('play').onclick = () => { quest.send('START', 'menu'); quest.send('SKIP', 'dialogue'); $('play').blur(); show(); };
    $('resume').onclick = () => { game.resume(); show(); };
    $('restart').onclick = () => game.reset();
    // ENDING offers RESTART as a table edge (owner ruling 12); CREDITS is terminal, so its restart is
    // resetGame(), like the pause menu's.
    $('end-restart').onclick = () => quest.send('RESTART', 'menu');
    $('end-credits').onclick = () => quest.send('OPEN_CREDITS', 'menu');
    $('credits-restart').onclick = () => game.reset();
    $('term-close').onclick = closeTerminal;
    setInterval(() => {
      const p = game.debug.player;
      $('readout').textContent = `build ${BUILD}  fps ${fps.fps}  ms ${fps.ms}  calls ${fps.calls}\nstate ${quest.state}\npos ${p.x.toFixed(2)}, ${p.z.toFixed(2)}  focus ${game.debug.focus ?? '-'}`;
    }, 200);
    show();
  },
};

const quantum = createDevEngine({ delayMs: 150 });
window.__engine = quantum; // dev fault injection for the playthrough
const game = startGame({ root: $('game-root'), quantum, ui });
game.quest.send('BOOT_COMPLETE', 'boot'); // platform's main.js does this once Pyodide and the scene are ready
// Stands in for main.js's `await game.ended` (Qollab stops listening once main.js returns): the
// harness records when, and with what, the promise settles.
window.__ended = 'pending';
Promise.resolve(game.ended).then((r) => { window.__ended = r ?? 'settled-with-nothing'; });
</script>
</body>
</html>
