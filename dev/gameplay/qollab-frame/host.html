<!doctype html>
<!-- DEV-ONLY stand-in for Qollab's Run view: the world in <iframe sandbox="allow-scripts"> (exactly
     Qollab's attribute, /_nuxt/BWPMdZ7B.js class Ol: no allow-same-origin, no allow-pointer-lock, no
     `allow`, never focused), loaded from a DIFFERENT origin than this page (localhost vs 127.0.0.1).
     The left column is the "rest of Qollab": clicking it takes focus away from the frame. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>ECHO — Qollab-frame harness</title>
<style>
  html, body { margin: 0; height: 100%; background: #f3f4f6; font: 13px/1.4 system-ui, sans-serif; }
  body { display: grid; grid-template-columns: 240px 1fr; }
  #side { padding: 14px; border-right: 1px solid #d1d5db; color: #374151; }
  #side h2 { font-size: 14px; margin: 0 0 8px; }
  #elsewhere { display: block; width: 100%; height: 120px; margin-top: 12px; box-sizing: border-box; }
  #frame-wrap { position: relative; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<div id="side">
  <h2>Qollab (stand-in)</h2>
  <p>The project runs in the frame on the right, sandbox=<code>allow-scripts</code>, cross-origin, unfocused.</p>
  <textarea id="elsewhere" aria-label="somewhere else on the page">click here to take focus away from the frame</textarea>
</div>
<div id="frame-wrap"></div>
<script>
  const frame = document.createElement('iframe');
  frame.setAttribute('sandbox', 'allow-scripts');
  frame.title = 'Project page';
  // A different origin from this page even before the sandbox makes it opaque.
  frame.src = `http://localhost:${location.port}/dev/gameplay/world.html`;
  document.getElementById('frame-wrap').appendChild(frame);
</script>
</body>
</html>
