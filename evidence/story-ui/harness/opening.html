<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECHO opening harness</title>
<link rel="stylesheet" href="../../../echo/main.css">
<style>
  /* Harness only: stand-in for the Three.js canvas (the scene lane drives the real camera from
     onShot), tinted per shot so a screenshot shows which shot is playing. */
  html, body { margin: 0; height: 100%; background: #03070d; }
  #stage { position: relative; width: 100vw; height: 100vh; overflow: hidden;
    background: radial-gradient(ellipse at 70% 30%, #0f2c44 0%, #071522 45%, #02050a 100%); }
  #stage[data-shot="B"] { background: radial-gradient(ellipse at 30% 60%, #3a2a10 0%, #0c1522 50%, #02050a 100%); }
  #stage[data-shot="C"] { background: radial-gradient(ellipse at 50% 20%, #1a3a3a 0%, #08141c 50%, #02050a 100%); }
  #stage[data-shot="D"] { background: radial-gradient(ellipse at 50% 80%, #1f2f4a 0%, #0a1420 55%, #02050a 100%); }
  #stage::after { content: "[ canvas placeholder · shot " attr(data-shot) " ]"; position: absolute; left: 50%; top: 45%;
    transform: translate(-50%, -50%); color: #4a6a88; font: 14px ui-monospace, monospace; }
  #provenance { position: fixed; right: 6px; top: 4px; z-index: 99; color: #ffe14d; background: #000;
    padding: 2px 6px; font: 12px ui-monospace, monospace; }
</style>
</head>
<body>
<main id="stage" data-shot="-"><div id="ui"></div></main>
<div id="provenance">loading…</div>
<script type="module" src="./opening-harness.js"></script>
</body>
</html>
