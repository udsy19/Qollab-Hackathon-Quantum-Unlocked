<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECHO terminals harness</title>
<link rel="stylesheet" href="../../../echo/main.css">
<style>
  /* Harness only: a dark stand-in for the Three.js canvas, the provenance badge and the event log. */
  html, body { margin: 0; height: 100%; background: #03070d; }
  #stage { position: relative; width: 100vw; height: 100vh; overflow: hidden;
    background: radial-gradient(ellipse at 70% 30%, #0f2c44 0%, #071522 45%, #02050a 100%); }
  #provenance { position: fixed; right: 6px; bottom: 4px; z-index: 99; color: #ffe14d; background: #000;
    padding: 2px 6px; font: 12px ui-monospace, monospace; }
  #eventlog { position: fixed; left: 6px; bottom: 4px; z-index: 99; color: #7dffb0; background: #000;
    padding: 2px 6px; font: 11px ui-monospace, monospace; max-width: 60vw; white-space: nowrap; overflow: hidden; }
</style>
</head>
<body>
<main id="stage"><div id="ui"></div></main>
<div id="eventlog">events: —</div>
<div id="provenance">loading…</div>
<script type="module" src="./terminals.js"></script>
</body>
</html>
