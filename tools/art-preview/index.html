<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ECHO art preview — atmosphere kit</title>
<!-- Dev-only (never uploaded). On Qollab `three` resolves by name; here the importmap does it. -->
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js" } }
</script>
<style>
  html, body { margin: 0; height: 100%; background: #070b12; color: #eaf3f6; font: 12px/1.4 ui-monospace, Menlo, monospace; overflow: hidden; }
  #view { position: fixed; inset: 0; }
  #panel { position: fixed; top: 8px; left: 8px; background: rgba(7, 11, 18, 0.82); border: 1px solid #132035; padding: 8px 10px; max-width: 330px; }
  #panel.hidden { display: none; }
  #panel button, #panel select { font: inherit; background: #132035; color: #eaf3f6; border: 1px solid #2a3c58; margin: 2px 2px 2px 0; padding: 2px 6px; }
  #panel button:focus-visible, #panel select:focus-visible, #panel input:focus-visible { outline: 2px solid #56e4f2; }
  #stats { color: #56e4f2; white-space: pre; }
  #log { color: #f3ae62; white-space: pre-wrap; max-height: 150px; overflow: auto; }
  h1 { font-size: 12px; margin: 0 0 4px; color: #f3ae62; }
</style>
</head>
<body>
<div id="view"></div>
<div id="panel">
  <h1>ECHO atmosphere kit</h1>
  <div id="stats">…</div>
  <div>quality <select id="q"><option>low</option><option selected>med</option><option>high</option></select>
    <label><input type="checkbox" id="rm"> reduced motion</label></div>
  <div>view <select id="view-sel"><option>alley</option><option>alley-wide</option><option>relay</option><option>passage</option><option>elevator</option><option>follow</option><option>rooftop</option><option>finalShot</option></select>
    <label><input type="checkbox" id="walk"> walk</label></div>
  <div><button id="play">play restoration</button><button id="reset">reset world</button>
    restoration <input type="range" id="prog" min="0" max="1" step="0.01" value="0"></div>
  <div id="ids"></div>
  <div><button id="unknown">apply unknown id</button></div>
  <div id="log"></div>
</div>
<script type="module" src="./preview.js"></script>
</body>
</html>
